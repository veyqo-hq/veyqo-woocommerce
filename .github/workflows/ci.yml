name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the installable zip
        run: |
          mkdir -p build/veyqo-woocommerce
          cp -r veyqo-woocommerce.php includes readme.txt LICENSE build/veyqo-woocommerce/
          cd build && zip -r veyqo-woocommerce.zip veyqo-woocommerce
      - uses: actions/upload-artifact@v4
        with:
          name: veyqo-woocommerce
          path: build/veyqo-woocommerce.zip
